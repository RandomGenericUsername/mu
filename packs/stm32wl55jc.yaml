# STM32WL55JC device pack (req-004 group 2.1).
# Values: spike-001-corrected (NOT sibling-copied). Dual core M4 + M0+.
# Conservative map: both cores share the soft-float target.
id: stm32wl55jc
version: "1.0.0"
family: stm32wl
stacks:
  c: make-cmsis
  cpp: make-cmsis
  rust: cargo-cortex-dual
cores:
  - name: M4
    arch: thumbv7em-none-eabi
  - name: M0+
    arch: thumbv6m-none-eabi # ARMv6-M (bug-021: was wrongly thumbv7em)
memory:
  # bug-021: the two cores must not share flash. CPU2 (CM0+) boots from its
  # reset vector (FLASH_SRRVR.SBRV), normally 0x08020000 — the second half.
  - name: flash_m4
    origin_hex: "0x08000000"
    size: 131072 # 128K
    cores: [M4]
  - name: flash_m0plus
    origin_hex: "0x08020000"
    size: 131072 # 128K
    cores: [M0+]
  # bug-014: per-core RAM so the M4 and M0+ don't share one stack. UNVERIFIED
  # on hardware (no WL55 attached) — mirrors the H755 fix; the 64K is
  # partitioned rather than re-addressed so it stays inside the known region.
  - name: ram_m4
    origin_hex: "0x20000000"
    size: 49152 # 48K
    cores: [M4]
  - name: ram_m0plus
    origin_hex: "0x2000C000"
    size: 16384 # 16K
    cores: [M0+]
probe:
  transport: stlink-dap
  address: openocd:stlink-dap
# Readback-first ladder: readback rung; DUAL_CORE OpenOCD session limits may
# force LED fallback for live verification (noted, not silently assumed).
probe_backend: openocd
proof_rung: readback
blocks:
  openocd:
    # bug-021: HLA ("stlink.cfg") cannot do multicore — the stm32wlx script
    # warns and forces DUAL_CORE 0, so the CM0+ was never exposed. The probe is
    # an STLINK-V3 (dapdirect), so use the DAP interface like the H755.
    interface: stlink-dap.cfg
    target: stm32wlx.cfg
    dual_core: true
    # OpenOCD target names (bug-023): the CPU2 boot cfg needs cpu0's name, and
    # the renderer uses them for per-core processor indices.
    targets:
      M4: stm32wlx.cpu0
      M0+: stm32wlx.cpu1
  # Sibling evidence ArmDevelopmentEnvironment@19a3889:
  # setup/create_project/stm_mcu_families.sh:17,22 FPU_*_PER_PROCESSOR["m0plus"]="none".
  # Neither core takes hard-float here (soft-float conservative map).
  fpu:
    mode: soft
    variant: none
  # Sibling evidence: setup/create_project/get_stm32wl55xx_resources.sh:10-11
  # CM4_LINKER=${MCU_FAMILY^^}_FLASH_CM4.ld, CM0_LINKER=${MCU_FAMILY^^}_FLASH_CM0PLUS.ld.
  linker:
    M4: STM32WL55XX_FLASH_CM4.ld
    M0+: STM32WL55XX_FLASH_CM0PLUS.ld
  # Placeholder-until-template-story: plausible HAL header default; real
  # defaults source + override precedence wired at template level (spike-004:
  # project-file-wins, pack default fills the rest).
  # Startup filenames verified against pinned submodules (ls), 2026-10-13.
  # Vendor system file (SystemInit) per core; verified against pinned
  # submodules (ls), 2026-10-13. H755 uses the dual-core boot file;
  # runtime boot semantics stay OPEN for HW smoke.
  system:
    M4: system_stm32wlxx.c
    M0+: system_stm32wlxx.c
  # Device selection macros, verified against the pinned submodule
  # family headers, 2026-10-13.
  defines:
    M4: STM32WL55xx
    M0+: STM32WL55xx
  startup:
    M4: startup_stm32wl55xx_cm4.s
    M0+: startup_stm32wl55xx_cm0plus.s
  config_headers:
    library: stm32hal
    header: stm32_config.h
    defaults_source: pack/defaults.h
  # probe-rs registry names verified against the pinned tool
  # (`probe-rs chip list` in lang-rust:1.99.0), 2026-10-13.
  probe_settings:
    probe-rs:
      chip: STM32WL55JC
  # On-board user LED LD1 (blue) = PB15, active HIGH (ops-017 example). UM2592
  # (Nucleo-64 MB1389): "LED1 blue LED (USER) ... connected to STM32WL I/O PB15
  # ... HIGH logic state". WL clocks GPIOs on AHB2ENR: GPIOB @0x48000400,
  # RCC_AHB2ENR @0x5800004C, GPIOBEN bit 1 (vendored cmsis-device-stm32wl55jc).
  # Default core clock MSI = 4 MHz. Blink runs on the primary core (M4).
  example:
    led:
      port: B
      pin: 15
      active: high
      gpio_base: 0x48000400
      rcc_en_addr: 0x5800004C
      rcc_en_bit: 1
      clock_hz: 4000000
    # bug-021: CPU2 (CM0+) stays in reset until CPU1 releases it (RM0453 §2.3).
    # CPU1 must (1) point CPU2's reset vector at its image via FLASH_SRRVR.SBRV
    # (word offset: 0x8000 -> 0x08020000) and (2) set PWR_CR4.C2BOOT. Addresses
    # from the vendored cmsis-device-stm32wl55jc header (FLASH base 0x58004000 +
    # 0x84; PWR base 0x58000400 + 0x0C, C2BOOT = bit 15).
    cpu2_boot:
      core: M0+
      writes:
        - addr: 0x58004084 # FLASH_SRRVR: SBRV -> 0x08020000
          value: 0x8000
          mask: 0x0000FFFF
        - addr: 0x5800040C # PWR_CR4: C2BOOT
          value: 0x8000
          mask: 0x00008000
  # Cortex-Debug register view (req-017): pinned SVD per core (WL M4/M0+).
  svd:
    M4: stm32wl/STM32WL5x_CM4.svd
    M0+: stm32wl/STM32WL5x_CM0P.svd
