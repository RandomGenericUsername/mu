# STM32H755 device pack (req-004 group 2.1).
# Values: spike-001-corrected (NOT sibling-copied). Dual core M7 + M4.
id: stm32h755
version: "1.0.0"
family: stm32h7
stacks:
  c: make-cmsis
  cpp: make-cmsis
  rust: cargo-cortex-dual
cores:
  - name: M7
    arch: thumbv7em-none-eabihf
  - name: M4
    arch: thumbv7em-none-eabihf
memory:
  - name: flash_m7
    origin_hex: "0x08000000"
    size: 1048576 # 1024K
    cores: [M7]
  - name: flash_m4
    origin_hex: "0x08100000"
    size: 1048576 # 1024K
    cores: [M4]
  # bug-014: per-core RAM. With one shared region both cores got the same
  # `_estack` (0x10048000) and clobbered each other's frames at boot — the M7
  # ended in HardFault and `make flash` never started the LED. Split by domain:
  # M7 -> AXI SRAM (D1), M4 -> D2 SRAM1+2+3. Verified on NUCLEO-H755ZI-Q
  # 2026-10-14 (shared map: GPIOE ODR 0xffffffff = never ran; split: ODR toggles,
  # M7 PC in delay_half_period, M4 counter runs).
  - name: ram_m7
    origin_hex: "0x24000000" # AXI SRAM (D1)
    size: 524288 # 512K
    cores: [M7]
  - name: ram_m4
    origin_hex: "0x30000000" # D2 SRAM1+2+3
    size: 294912 # 288K
    cores: [M4]
probe:
  transport: stlink-dap
  address: openocd:stlink-dap
# Readback-first ladder: readback rung executed per core (M7 then M4).
probe_backend: openocd
proof_rung: readback-m7-m4
blocks:
  openocd:
    interface: stlink-dap.cfg
    board: st_nucleo_h745zi.cfg
    dual_core: true
    # Core -> OpenOCD target names (board cfg creates these); lets a two-piece
    # flash land M7 and M4 images on their own cores (bug-006).
    targets:
      M7: stm32h7x.cpu0
      M4: stm32h7x.cpu1
  # Sibling evidence ArmDevelopmentEnvironment@19a3889:
  # setup/create_project/stm_mcu_families.sh:19 FPU_V_PER_PROCESSOR["m7"]=fpv5-sp-d16 (hard).
  # Pack-level block carries the primary (M7) facet; M4 uses fpv4-sp-d16/hard.
  fpu:
    mode: hard
    variant: fpv5-sp-d16
  # Sibling evidence: setup/create_project/dual/Startup/stm32h755xx_flash_cm7.ld,
  # stm32h755xx_flash_cm4.ld.
  linker:
    M7: stm32h755xx_flash_cm7.ld
    M4: stm32h755xx_flash_cm4.ld
  # Placeholder-until-template-story: plausible HAL header default; real
  # defaults source + override precedence wired at template level (spike-004:
  # project-file-wins, pack default fills the rest).
  # Startup filenames verified against pinned submodules (ls), 2026-10-13.
  # Vendor system file (SystemInit) per core; verified against pinned
  # submodules (ls), 2026-10-13. H755 uses the dual-core boot file;
  # runtime boot semantics stay OPEN for HW smoke.
  system:
    M7: system_stm32h7xx_dualcore_boot_cm4_cm7.c
    M4: system_stm32h7xx_dualcore_boot_cm4_cm7.c
  # Device selection macros, verified against the pinned submodule
  # family headers, 2026-10-13.
  # Space-separated: every macro becomes a -D flag. Dual-core H7 needs
  # CORE_CM7/CORE_CM4 alongside the part macro (header demands it).
  defines:
    M7: STM32H755xx CORE_CM7
    M4: STM32H755xx CORE_CM4
  startup:
    M7: startup_stm32h755xx.s
    M4: startup_stm32h755xx.s
  config_headers:
    library: stm32hal
    header: stm32_config.h
    defaults_source: pack/defaults.h
  # probe-rs registry names verified against the pinned tool
  # (`probe-rs chip list` in lang-rust:1.99.0), 2026-10-13.
  probe_settings:
    probe-rs:
      chip: STM32H755ZI
  # On-board yellow user LED LD2 = PE1, active HIGH (req-015 example). UM2408
  # (Nucleo-144 MB1363): "User LD2: A yellow user LED is connected to PE1".
  # LD1 (green) is PB0-or-PA5 via solder bridge SB54/SB65, so PE1 avoids the
  # ambiguity. H7 clocks GPIOs on AHB4ENR: GPIOE @0x58021000, RCC_AHB4ENR
  # @0x580244E0, GPIOEEN bit 4 (verified in the vendored cmsis-device-stm32h755
  # header). Default core clock HSI = 64 MHz. Blink runs on the primary core (M7).
  example:
    led:
      port: E
      pin: 1
      active: high
      gpio_base: 0x58021000
      rcc_en_addr: 0x580244E0
      rcc_en_bit: 4
      clock_hz: 64000000
  # Cortex-Debug register view (req-017): pinned SVD per core (H755 CM7/CM4).
  svd:
    M7: stm32h7/STM32H755_CM7.svd
    M4: stm32h7/STM32H755_CM4.svd
